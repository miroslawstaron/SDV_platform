name: sdv-platform
x-worker: &worker
  image: sdv-native:local
  init: true
  restart: unless-stopped
  volumes:
    - sdv-data:/data
  depends_on:
    registry:
      condition: service_started
      restart: true
  healthcheck:
    test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 5s
    start_period: 60s
    retries: 12

services:
  carla:
    profiles: [carla-docker]
    image: carlasim/carla:0.9.16
    container_name: carla-0.9.16
    init: true
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      LP_NUM_THREADS: 12
    command: [bash, CarlaUE4.sh, -RenderOffScreen, -nosound, -quality-level=Low, -ResX=320, -ResY=180]
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/2000"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20
  carla-client:
    image: sdv-python:local
    init: true
    restart: unless-stopped
    network_mode: host
    command: [python3, -m, sdv.carla_service]
    volumes: ["sdv-data:/data"]
    environment:
      CARLA_HOST: ${CARLA_HOST:-host.docker.internal}
      CARLA_PORT: ${CARLA_PORT:-2000}
      CARLA_RENDERER: ${CARLA_RENDERER:-nvidia}
      CARLA_CLIENT_RUNTIME: ${CARLA_CLIENT_RUNTIME:-${CARLA_RUNTIME:-windows}}
      CARLA_CLIENT_URL: ${CARLA_CLIENT_URL:-http://host.docker.internal:2003}
      CARLA_CAMERA_WIDTH: ${CARLA_CAMERA_WIDTH:-1920}
      CARLA_CAMERA_HEIGHT: ${CARLA_CAMERA_HEIGHT:-1080}
    healthcheck:
      test: [CMD, python3, -c, "import httpx; c=httpx.Client(transport=httpx.HTTPTransport(uds='/data/carla-service.sock')); c.get('http://carla/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    image: sdv-python:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["sdv-data:/data"]
    environment:
      MAPILLARY_ACCESS_TOKEN: ${MAPILLARY_ACCESS_TOKEN:-}
      SIMULATOR_BACKEND: ${SIMULATOR_BACKEND:-carla}
      CARLA_RUNTIME: ${CARLA_RUNTIME:-windows}
      CARLA_CLIENT_RUNTIME: ${CARLA_CLIENT_RUNTIME:-${CARLA_RUNTIME:-windows}}
    depends_on:
      recorder: {condition: service_healthy}
      maps: {condition: service_healthy}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  registry:
    image: sdv-native:local
    build:
      context: .
      dockerfile: native/Dockerfile
      additional_contexts:
        python-runtime: service:api
    init: true
    restart: unless-stopped
    command: [sil-kit-registry, --listen-uri, "silkit://0.0.0.0:8500"]
  plant:
    <<: *worker
    depends_on:
      registry: {condition: service_started, restart: true}
      carla-client: {condition: service_healthy}
    environment:
      ROLE: plant
      CARLA_HOST: ${CARLA_HOST:-}
      CARLA_PORT: ${CARLA_PORT:-2000}
      CARLA_RENDERER: ${CARLA_RENDERER:-software}
  sensor:
    <<: *worker
    environment: {ROLE: sensor}
  bms:
    <<: *worker
    environment: {ROLE: bms}
  navigation:
    <<: *worker
    environment: {ROLE: navigation}
  controller:
    <<: *worker
    environment:
      ROLE: controller
      APPLICATION_COMMAND: ${CONTROLLER_COMMAND:-python3 -m sdv.application}
  powertrain:
    <<: *worker
    environment: {ROLE: powertrain}
  brake:
    <<: *worker
    environment: {ROLE: brake}
  lane:
    <<: *worker
    environment: {ROLE: lane}
  recorder:
    image: sdv-python:local
    init: true
    command: [uvicorn, sdv.recorder:app, --host, 0.0.0.0, --port, "8000"]
    volumes: ["sdv-data:/data"]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10
  maps:
    image: sdv-python:local
    init: true
    command: [uvicorn, sdv.maps:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      OVERPASS_URL: ${OVERPASS_URL:-https://maps.mail.ru/osm/tools/overpass/api/interpreter}
    volumes: ["sdv-data:/data"]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      start_period: 30s
      retries: 10
  kuksa:
    image: ghcr.io/eclipse-kuksa/kuksa-databroker:0.7.1
    command: [--insecure, --vss, /contracts/vss.json]
    volumes: ["./contracts:/contracts:ro"]
  gateway:
    image: sdv-python:local
    init: true
    command: [python3, -m, sdv.gateway]
    depends_on: [kuksa, api]
  instruments:
    image: sdv-instruments:local
    build: {context: ., dockerfile: instruments/Dockerfile}
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:8081:80"]
    depends_on:
      api: {condition: service_healthy, restart: true}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build: {context: ./web}
    init: true
    ports: ["${SDV_WEB_BIND:-127.0.0.1}:8080:80"]
    depends_on:
      api: {condition: service_healthy, restart: true}
      instruments: {condition: service_healthy, restart: true}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  sdv-data:
