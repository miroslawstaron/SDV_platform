server {
  listen 80;
  root /usr/share/nginx/html;
  location = /health { access_log off; return 200 "ready\n"; }
  location = /presentation { return 301 /presentation/; }
  location /presentation/ { index index.html; try_files $uri $uri/ =404; }
  location = /instruments { return 301 /instruments/; }
  location /instruments/ {
    proxy_pass http://instruments:80/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
  }
  location /api/ {
    client_max_body_size 12m;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }
  location / { try_files $uri /index.html; }
}
